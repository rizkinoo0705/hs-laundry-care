services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hs_laundry
      POSTGRES_USER: hs
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hs -d hs_laundry"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: hs_laundry
      DB_USERNAME: hs
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
